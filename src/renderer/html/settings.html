<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NFCToolsGUI</title>
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/subWindow.css" />
    <link rel="stylesheet" href="../css/scrollBar.css">
</head>
<body>

<div class="title">{{ html_theme }}</div>
<button id="dark-mode" onclick="window.darkMode.dark()">{{ html_theme_dark }}</button>
<button id="light-mode" onclick="window.darkMode.light()">{{ html_theme_light }}</button>
<button id="follow-system-mode" onclick="window.darkMode.system()">{{ html_theme_system }}</button>

<div class="title">{{ html_speed }}</div>
<select id="speed-select" onchange="window.electronAPI.execAction('set-speed', parseInt(this.value))">
    <option value="115200">115200</option>
    <option value="230400">230400</option>
    <option value="460800">460800</option>
    <option value="921600">921600</option>
</select>

<div class="title">{{ html_device_group }}</div>
<label class="switch-row">
    <input type="checkbox" id="auto-select-device">
    <span>{{ html_auto_select_device }}</span>
</label>

<div class="title">{{ html_dump_group }}</div>
<label class="switch-row">
    <input type="checkbox" id="silent-save-dump">
    <span>{{ html_silent_save_dump }}</span>
</label>

<div class="title">{{ html_solving_group }}</div>
<label class="switch-row">
    <input type="checkbox" id="full-enc-solve">
    <span>{{ settings_full_enc_label }}</span>
</label>

<div class="final-button">
    <button onclick="window.electronAPI.closeCurrentWindow()">{{ dialog_button_cancel }}</button>
</div>
</body>
<script src="../js/i18n.js"></script>
<script>
    const setSetting = (key, value) => window.electronAPI.execAction('set-setting', {key, value})

    window.electronAPI.onSettingsValues((_event, value) => {
        const speed = document.getElementById("speed-select")
        if (speed && value && value.speed) speed.value = String(value.speed)
        const autoSelect = document.getElementById("auto-select-device")
        if (autoSelect && value) autoSelect.checked = !!value.autoSelectDevice
        const silentSave = document.getElementById("silent-save-dump")
        if (silentSave && value) silentSave.checked = !!value.silentSaveDump
        const fullEnc = document.getElementById("full-enc-solve")
        if (fullEnc && value) fullEnc.checked = !!value.fullEncEnabled
    })

    document.getElementById("auto-select-device").addEventListener("change", (e) => {
        setSetting("autoSelectDevice", e.target.checked)
    })
    document.getElementById("silent-save-dump").addEventListener("change", (e) => {
        setSetting("silentSaveDump", e.target.checked)
    })
    document.getElementById("full-enc-solve").addEventListener("change", (e) => {
        setSetting("fullEncEnabled", e.target.checked)
    })
</script>
</html>

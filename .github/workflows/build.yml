name: build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'doc/**'
      - 'README*'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest ]

    steps:
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64

      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Compile core files (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: sh ./compile.sh

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile GUI
        env:
          NFCTOOLSGUI_COMPILER: "Github Actions"
        run: npm run make

      - name: Collect output files (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p upload
          find out/make/zip -name "*.zip" -exec cp {} upload/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NFCToolsGUI-${{ runner.os }}-${{ runner.arch }}
          path: upload